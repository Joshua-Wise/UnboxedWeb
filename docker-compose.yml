version: '3.8'

services:
  mbox-converter:
    build: .
    container_name: mbox-to-pdf-converter
    ports:
      - "8080:5000"
    volumes:
      # Optional: persist uploads and outputs if needed
      - /Users/joshuawise/Documents/GitHub/pdfbox/uploads:/tmp/uploads
      - /Users/joshuawise/Documents/GitHub/pdfbox/outputs:/tmp/outputs
      - /Users/joshuawise/Documents/GitHub/pdfbox/data:/app/data
    environment:
      - FLASK_APP=app.main
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
